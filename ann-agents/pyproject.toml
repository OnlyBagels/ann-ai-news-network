[project]
name = "ann-agents"
version = "0.1.0"
description = "ANN Agentic AI Newsroom - Multi-agent journalism system"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "redis>=5.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "google-genai>=1.0.0",
    "anthropic>=0.30.0",
    "feedparser>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "arxiv>=2.0.0",
    "praw>=7.0.0",
    "huggingface-hub>=0.20.0",
    "githubkit>=0.11.0",
    "newspaper4k>=0.9.0",
    "trafilatura>=1.6.0",
    "rich>=13.0.0",
    "loguru>=0.7.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "meilisearch>=0.58.0",
    "uvicorn>=0.27.0",
    "fastapi>=0.110.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
